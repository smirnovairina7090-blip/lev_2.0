name: Clone fixed student project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  clone:
    if: ${{ !contains(github.event.head_commit.message, '[lev-clone-sync]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Clone fixed project
        run: |
          rm -rf /tmp/fixed-project
          git clone --depth 1 --branch student-evgenia-fixed https://github.com/smirnovairina7090-blip/azazels-alchemy-table.git /tmp/fixed-project
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/fixed-project/ ./

      - name: Verify build
        run: gradle build --stacktrace

      - name: Remove generated files
        run: rm -rf .gradle build

      - name: Commit cloned project
        run: |
          git config user.name "ChatGPT repository clone"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clone fixed student project [lev-clone-sync]"
          git push origin HEAD:main
